<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học từ vựng tiếng Hàn – Vocab Farm V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F7;--sf:#fff;--ink:#0F1B3D;--mute:#5B6785;--line:#D3D9E8;--blue:#1E3FBF;--on:#fff;--ok:#1B7F5A;--bad:#C23A30;--sun:#F4B400;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1220;--sf:#171C2F;--ink:#E8ECF8;--mute:#9AA5C4;--line:#2A3150;--blue:#7C96FF;--on:#0E1220;--ok:#4CC38F;--bad:#FF7B70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1220;--sf:#171C2F;--ink:#E8ECF8;--mute:#9AA5C4;--line:#2A3150;--blue:#7C96FF;--on:#0E1220;--ok:#4CC38F;--bad:#FF7B70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font:700 36px/1 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
h1 small{display:block;font:500 13px/1.4 'Be Vietnam Pro',sans-serif;color:var(--mute);margin-top:6px}
h2{font-size:18px;margin:22px 0 6px}
.st{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.st b{color:var(--ink);font-size:20px;margin-right:4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.tab{background:none;border:0;padding:9px 16px;font:600 15px 'Be Vietnam Pro',sans-serif;color:var(--mute);cursor:pointer;border-radius:6px 6px 0 0}
.tab.on{background:var(--ink);color:var(--bg)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute)}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.card{min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;padding:28px 20px;margin-top:10px;background:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent),color-mix(in srgb,var(--line) 55%,transparent)) center/1px 100% no-repeat,linear-gradient(color-mix(in srgb,var(--line) 55%,transparent),color-mix(in srgb,var(--line) 55%,transparent)) center/100% 1px no-repeat,var(--sf);border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--sun);cursor:pointer}
.card.s{min-height:170px}
.hg{font:700 clamp(48px,14vw,88px)/1.15 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.vn{font:600 clamp(24px,7vw,36px)/1.25 'Be Vietnam Pro',sans-serif}
.sub{color:var(--blue);font-weight:500}
.ex{font:500 18px/1.5 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--mute);margin-top:6px}
.mute{color:var(--mute);font-size:14px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:130px}
.btn{font:600 15px 'Be Vietnam Pro',sans-serif;padding:12px 16px;border-radius:6px;border:2px solid var(--ink);background:var(--sf);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--blue);color:var(--on);border-color:var(--blue)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-width:1.5px;flex:none;min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;padding:13px 14px;border:2px solid var(--line);background:var(--sf);color:var(--ink);border-radius:6px;font:500 16px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.opt.k{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:22px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--sf))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--sf))}
#ti{width:100%;margin-top:16px;font:700 28px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:12px}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.add input,.srch{width:100%}
.row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rh{font:700 22px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.rm span{display:block;font-size:13px;color:var(--mute)}
.pips i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:3px}
.pips i.on{background:var(--ok)}
textarea{width:100%;min-height:170px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.msg{margin-top:10px;font-weight:500}
.rad{display:flex;gap:16px;margin:10px 0;font-size:14px}
input[type=time]{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px}
.ctl label{display:flex;gap:8px;align-items:center}
a.btn{display:block;text-decoration:none;text-align:center}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(min-width:560px){.mg{grid-template-columns:repeat(4,1fr)}}
.tile{min-height:78px;padding:8px;border:2px solid var(--ink);border-radius:6px;background:var(--sf);color:var(--ink);font:500 16px 'Be Vietnam Pro',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.tile.k{font:700 22px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.tile.on{background:var(--sun);color:#0F1B3D;border-color:var(--sun)}
.tile.ok{background:color-mix(in srgb,var(--ok) 18%,var(--sf));border-color:var(--ok);opacity:.55;box-shadow:none}
.tile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--sf))}
:root[data-skin=farm]{--bg:#DDEFC4;--sf:#FFF8E1;--ink:#4A2F1B;--mute:#7A5C3E;--line:#E3D3A8;--blue:#2F8F46;--on:#fff;--ok:#2F8F46;--bad:#C0452F;--sun:#F2B134;color-scheme:light}
[data-skin=farm] body{background:linear-gradient(#BFE3F5,#DDEFC4 280px) no-repeat,#DDEFC4}
[data-skin=farm] h1{font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
[data-skin=farm] h1::before{content:'🌾 '}
[data-skin=farm] .tabs{border-bottom:4px solid #8B5E34}
[data-skin=farm] .tab.on{background:#8B5E34;color:#FFF8E1;border-radius:10px 10px 0 0}
[data-skin=farm] .card{border:3px solid #6B4423;border-radius:18px;box-shadow:0 7px 0 #8B5E34}
[data-skin=farm] .btn,[data-skin=farm] .opt,[data-skin=farm] .tile{border-radius:12px;box-shadow:0 3px 0 #6B4423}
[data-skin=farm] .btn.pri{background:#2F8F46;border-color:#1F6B33;box-shadow:0 3px 0 #1F6B33}
[data-skin=farm] .btn.ok{box-shadow:0 3px 0 #1F6B33}
[data-skin=farm] .tile.on{background:#F2B134;color:#4A2F1B;border-color:#8B5E34}
[data-skin=farm] select,[data-skin=farm] input[type=text],[data-skin=farm] input[type=time],[data-skin=farm] textarea{border-radius:10px;border-color:#C9B27C}
[data-skin=farm] .bar{background:#E3D3A8;height:10px;border-radius:5px}
[data-skin=farm] .bar i{background:linear-gradient(90deg,#7BC043,#2F8F46)}
#farm{display:none}
[data-skin=farm] #farm{display:block}
.fm{background:repeating-linear-gradient(#8B5E34 0 18px,#7C5129 18px 20px);border:3px solid #6B4423;border-radius:14px;padding:10px;margin-bottom:16px}
.fm .mute{color:#FFF8E1;margin-bottom:6px}
.pl{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;font-size:20px;background:#6B4423;border-radius:8px;margin:2px}
@keyframes pop{0%{transform:scale(.3);filter:brightness(1.6)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.pp{position:fixed;left:50%;top:34%;z-index:60;transform:translateX(-50%);font:700 22px 'Be Vietnam Pro',sans-serif;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:fl 1s ease-out forwards}
.pp.big{top:22%;font-size:26px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;text-shadow:none}
@keyframes fl{to{transform:translate(-50%,-70px);opacity:0}}
.sh{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.pp,.sh{animation:none}}
.pl.sick{cursor:pointer;outline:2px dashed #FFF8E1;outline-offset:-3px}
.pl.pop{animation:pop .7s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.yard{margin-top:8px;padding-top:8px;border-top:2px dashed #C9B27C;font-size:28px;line-height:1.3}
.yard span{display:inline-block;margin:0 5px}
.yard .pet{animation:bob 1.6s ease-in-out infinite}
.yard span:nth-child(2n){animation-delay:.5s}
.shop{display:grid;gap:10px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--sf);border:2px solid var(--line);border-radius:12px}
.it .em{font-size:34px}
.it div:nth-child(2){flex:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dq{background:var(--sf);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;margin-bottom:16px}
.dqt{font-weight:600;margin:2px 0 8px}
[data-skin=farm] .dq{border-radius:14px;border-color:#6B4423}
.hit{display:inline-block;animation:pop .5s}
.tabs{overflow-x:auto}
.tab{white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== V2: Korean Vocab Farm ===== */
@media(prefers-color-scheme:light){:root{--bg:#FFF6E3;--sf:#FFFDF6;--ink:#3A2E22;--mute:#7C6B58;--line:#EBDDBF;--blue:#2E9B52;--on:#fff;--ok:#2E9B52;--bad:#D9503F;--sun:#FFC83D}}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17201A;--sf:#1F2B22;--ink:#F1EBDD;--mute:#B2A68F;--line:#34453A;--blue:#6FCF8A;--on:#10201A;--ok:#6FCF8A;--bad:#FF8A78;--sun:#FFC83D}}
:root body{background:radial-gradient(900px 380px at 50% -100px,color-mix(in srgb,#7BC043 35%,transparent),transparent),var(--bg)}

.top{flex-direction:column;align-items:stretch;gap:10px;background:linear-gradient(135deg,#7BC043,#2E9B52);border-radius:26px;padding:14px;box-shadow:0 6px 0 #22763F;margin-bottom:16px}
.top>div{width:100%}
:root h1{color:#fff;display:flex;align-items:center;gap:12px;font-size:32px}

:root h1 small{color:#EAF7DD}

.st b{color:var(--ink);font-size:20px;margin:0}
.st .lv{grid-column:span 2}
.xb{display:block;height:10px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden;font-style:normal}

:root #sk,:root #sn{background:#ffffff30;color:#fff;border:2px solid #ffffff55;min-height:34px}
:root .tabs{display:flex;gap:6px;border:0;background:var(--sf);padding:6px;border-radius:22px;box-shadow:0 4px 0 var(--line);overflow-x:auto;margin-bottom:16px}
:root .tab{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:66px;padding:8px 10px;border-radius:16px;font-size:12px;color:var(--mute);transition:background .2s,color .2s}
.tab .ti{font-size:22px;line-height:1.1;transition:transform .25s}
:root .tab.on{background:linear-gradient(#58C16F,#2E9B52);color:#fff;box-shadow:0 3px 0 #22763F}
.tab.on .ti{transform:scale(1.2) rotate(-6deg)}
@media(max-width:640px){:root .tabs{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;margin:0;gap:2px;box-shadow:0 8px 24px #0004,0 4px 0 var(--line)}:root .tab{min-width:0;padding:6px 2px;font-size:10px}}
.pg{animation:cin .3s ease-out}

:root .card.s{min-height:180px}

:root .card.fl{animation:flipin .45s ease-out}

.hg{text-shadow:0 3px 0 color-mix(in srgb,var(--sun) 45%,transparent)}
:root .btn{border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--sf);color:var(--ink);box-shadow:none;min-height:48px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.5;transform:none}
:root .btn.pri{background:#3FAE62;border-color:#22763F;color:#fff}
:root .btn.ok{background:#2E9B52;border-color:#22763F;color:#fff}
:root .btn.bad{background:var(--sf);border-color:var(--bad);color:var(--bad)}
:root .btn.sm{min-height:34px;border-bottom-width:3px;border-radius:12px}

.opt.right{animation:pulse .5s}

@keyframes pulse{50%{transform:scale(1.04)}}

.tile:hover{transform:translateY(-2px)}
:root .tile.on{background:var(--sun);color:#3A2E22;border-color:#E0A800;transform:translateY(-3px)}
:root .tile.ok{animation:pulse .5s}

@keyframes stripe{to{background-position:28px 0}}
select,input[type=text],input[type=time],textarea{border-radius:14px;padding:10px 12px}
:root .dq{border:0;border-left:8px solid var(--sun);border-radius:18px;background:linear-gradient(90deg,color-mix(in srgb,var(--sun) 20%,var(--sf)),var(--sf));box-shadow:0 4px 0 var(--line)}

:root .it .em{font-size:50px;width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 35%,transparent),transparent 70%);animation:bob 2.4s ease-in-out infinite}

</style>
<style id="v3">

.fm::before{content:none!important}

<script>
const KEY='hanvocab.v1';
const SAMPLE=`안녕하세요\tXin chào\tannyeonghaseyo\t안녕하세요. 저는 민수예요.\tChào hỏi
감사합니다\tCảm ơn\tgamsahamnida\t정말 감사합니다.\tChào hỏi

작다\tNhỏ\tjakda\t가방이 작아요.\tTính từ
예쁘다\tĐẹp\tyeppeuda\t꽃이 예뻐요.\tTính từ`;
const IV0=[0,6e5,864e5,2592e5,6048e5,12096e5],IV=new Proxy(IV0,{get:(t,k)=>typeof k=='string'&&/^\d+$/.test(k)&&has(3)?t[k]*1.5:t[k]});
const HDR=/^(한글|hangul|han|korean|tiếng hàn|từ vựng|từ)$/i;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function pick(o,keys){for(const k of keys.split(' '))for(const kk in o)if(kk.toLowerCase()==k)return o[kk];return''}
function parseTable(t){
  t=t.replace(/^\uFEFF/,'').trim();if(!t)return[];
  if(t[0]=='['||t[0]=='{'){try{let j=JSON.parse(t);if(!Array.isArray(j))j=j.cards||j.words||[j];
    return j.map(o=>Array.isArray(o)?o:[pick(o,'h han hangul korean ko'),pick(o,'m nghia meaning vi'),pick(o,'p pronunciation romanization'),pick(o,'e example vd'),pick(o,'g group nhom'),o.box,o.due,pick(o,'bo deck dn')])}catch(e){}}
  const first=t.split(/\r?\n/)[0];
  const d=['\t',',',';','|'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==d){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  r.push(c);rows.push(r);return rows}
function toCards(rows){
  return rows.map(r=>r.map(x=>typeof x=='string'?x.trim():x)).filter((r,i)=>r[0]&&r[1]&&!(i==0&&HDR.test(String(r[0]))))
    .map(r=>({id:uid(),dn:String(r[7]||''),h:String(r[0]),m:String(r[1]),p:r[2]||'',e:r[3]||'',g:r[4]||'',box:+r[5]||0,due:+r[6]||0}))}

function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.cards)return j}catch(e){}
  return{cards:toCards(parseTable(SAMPLE)),opt:{mode:'card',dir:'kv',group:'',due:false}}}
let S=load();S.rem=S.rem||{on:false,time:'20:00',last:''};
S.decks=S.decks&&S.decks.length?S.decks:[{id:'d0',name:'Bộ mặc định'}];
S.cards.forEach(c=>{if(!S.decks.some(d=>d.id==c.d))c.d=S.decks[0].id});
if(!S.decks.some(d=>d.id==S.deck))S.deck='';
function CS(){return S.deck?S.cards.filter(c=>c.d==S.deck):S.cards}
const deckName=id=>(S.decks.find(d=>d.id==id)||{}).name||'';
function ensureDeck(n){n=n.trim();let d=S.decks.find(x=>x.name.toLowerCase()==n.toLowerCase());if(!d){d={id:'d'+uid(),name:n};S.decks.push(d)}return d.id}
function setDeck(id){S.deck=id;S.opt.group='';save();MG=null;BS=null;if(RC)clearInterval(RC.iv);RC=null;startSession();render()}
function deckBar(){const n=id=>S.cards.filter(c=>!id||c.d==id).length;
  $('#decks').innerHTML=`<div class="ctl"><label>Bộ từ <select aria-label="Chọn bộ từ vựng" onchange="setDeck(this.value)"><option value="">Tất cả bộ (${n('')})</option>${S.decks.map(d=>`<option value="${d.id}" ${S.deck==d.id?'selected':''}>${esc(d.name)} (${n(d.id)})</option>`).join('')}</select></label><button class="btn sm" onclick="setView('data')">Quản lý bộ</button></div>`}
function addDeck(){const v=$('#nd2').value.trim();if(!v)return;ensureDeck(v);save();rData();msg('Đã tạo bộ “'+v+'”.')}
function renDeck(id,v){v=v.trim();const d=S.decks.find(x=>x.id==id);if(d&&v){d.name=v;save();deckBar()}}
function delDeck(id){if(S.decks.length<2){rData();return msg('Phải giữ lại ít nhất một bộ.',1)}
  S.cards=S.cards.filter(c=>c.d!=id);S.decks=S.decks.filter(d=>d.id!=id);if(S.deck==id)S.deck='';save();startSession();render();setView('data')}
function deckUI(){const cur=S.deck||S.decks[0].id;
  return`<h2>Bộ từ vựng</h2><p class="mute">Mỗi bộ có từ riêng, mọi chế độ học, vườn và thống kê đều theo bộ đang chọn ở trên. XP, cấp độ và cửa hàng dùng chung cho tất cả bộ.</p>`+
  S.decks.map(d=>`<div class="row" style="grid-template-columns:1fr auto auto"><input type="text" value="${esc(d.name)}" aria-label="Tên bộ" onchange="renDeck('${d.id}',this.value)"><span class="mute">${S.cards.filter(c=>c.d==d.id).length} từ</span><button class="btn sm bad" onclick="danger(this,()=>delDeck('${d.id}'))">Xóa bộ</button></div>`).join('')+
  `<div class="add" style="margin-top:10px"><input type="text" id="nd2" placeholder="Tên bộ mới"><button class="btn pri sm" onclick="addDeck()">Tạo bộ</button></div>`}

  return`<div class="ctl"><label>Nhập vào <select id="tg" onchange="$('#nd').style.display=this.value=='__new'?'':'none'">${S.decks.map(d=>`<option value="${d.id}" ${d.id==cur?'selected':''}>${esc(d.name)}</option>`).join('')}<option value="__auto">Theo cột “bo” trong file JSON</option><option value="__new">Bộ mới…</option></select></label><input type="text" id="nd" placeholder="Tên bộ mới" style="display:none"></div>`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let view='study',Q=[],cur=null,flipped=false,done=0,answered=null,wrong=false,optIds=[];

function startSession(){
  const now=Date.now(),o=S.opt;
  Q=shuffle(CS().filter(c=>(!o.group||c.g==o.group)&&(!o.due||c.due<=now)&&(o.mode!='order'||ordOk(c))).map(c=>c.id));

function next(){
  cur=Q.length?S.cards.find(c=>c.id==Q[0]):null;flipped=false;answered=null;wrong=false;
  if(cur&&['quiz','listen'].includes(S.opt.mode))optIds=mkOpts(cur)}
function mkOpts(c){
  const kv=S.opt.mode=='listen'||S.opt.dir=='kv'||(S.opt.mode=='boss'&&BS&&BS.e=='👺'),f=x=>kv?x.m:x.h,seen=new Set([f(c)]),d=[];
  for(const x of shuffle((CS().length>3?CS():S.cards).filter(x=>x.id!=c.id))){if(!seen.has(f(x))){seen.add(f(x));d.push(x)}if(d.length==3)break}
  return shuffle([c,...d]).map(x=>x.id)}
function mark(ok){sfx(ok?'ok':'bad');gain((ok?5:1)*(S.opt.mode=='type'&&has(0)?2:1)+(ok&&has(10)?2:0));if(ok){GROW.add(cur.id);dqAdd('ok',1)}cur.box=ok?Math.min(5,cur.box+1):0;cur.due=Date.now()+IV[cur.box];res(cur,ok);wrong=!ok;if(ok)done++;save()}

function opt(k,v){S.opt[k]=v;save();MG=null;BS=null;if(RC)clearInterval(RC.iv);RC=null;startSession();rStudy()}
function learnAll(){S.opt.due=false;save();startSession();render()}

function stats(){farm();
  const now=Date.now(),n=CS().length;
  $('#st').innerHTML=`<span class="lv"><b>Lv ${1+Math.floor((S.xp||0)/100)}</b>${coins()} XP<em class="xb"><u style="width:${(S.xp||0)%100}%"></u></em></span><span><b>${streak()}</b>ngày học liên tiếp</span><span><b>${n}</b>từ</span><span><b>${CS().filter(c=>c.box>=3).length}</b>đã thuộc</span><span><b>${CS().filter(c=>c.due<=now).length}</b>cần ôn</span>`}
function setView(v){view=v;render()}
const TI={study:'🌱',list:'📖',shop:'🛒',dex:'🏆',rem:'⏰',data:'💾'};
function render(){
  const pg=$('#app');pg.classList.remove('pg');void pg.offsetWidth;pg.classList.add('pg');
  deckBar();$('#tabs').innerHTML=[['study','Học'],['list','Từ vựng'],...(S.skin?[['shop','Cửa hàng']]:[]),['dex','Sổ sưu tầm'],['rem','Nhắc học'],['data','Dữ liệu']].map(([k,l])=>`<button class="tab ${view==k?'on':''}" onclick="setView('${k}')"><span class="ti">${TI[k]}</span><span>${l}</span></button>`).join('');
  stats();({study:rStudy,list:rList,shop:rShop,dex:rDex,rem:rRem,data:rData})[view]()}

function rStudy(){
  const o=S.opt,gs=[...new Set(CS().map(c=>c.g).filter(Boolean))];
  const sel=(v,l)=>`<option value="${esc(v)}" ${o.mode==v||o.dir==v||o.group==v?'selected':''}>${esc(l)}</option>`;
  $('#app').innerHTML=bkHtml()+dqHtml()+`<div class="ctl">
    <select aria-label="Chế độ" onchange="opt('mode',this.value)">${[['card','Thẻ ghi nhớ'],['quiz','Trắc nghiệm'],['type','Gõ tiếng Hàn'],['listen','Nghe và chọn'],['order','Sắp xếp câu'],['sent','Đặt câu (Claude chấm)'],['match','Ghép cặp'],['race','Đua 60 giây'],['boss','Đấu boss']].map(a=>sel(...a)).join('')}</select>
    ${['card','quiz','race','boss'].includes(o.mode)?`<select aria-label="Chiều học" onchange="opt('dir',this.value)">${sel('kv','Hàn → Việt')}${sel('vk','Việt → Hàn')}</select>`:''}
    <select aria-label="Nhóm" onchange="opt('group',this.value)"><option value="">Mọi nhóm</option>${gs.map(g=>sel(g,g)).join('')}</select>
    <label class="chk"><input type="checkbox" ${o.due?'checked':''} onchange="opt('due',this.checked)"> Chỉ từ cần ôn</label></div><div id="stage"></div>`;
  stage()}

function stage(){
  const el=$('#stage');if(!el)return;const o=S.opt;if(o.mode=='match')return gMatch(el);if(o.mode=='race')return gRace(el);if(o.mode=='boss')return gBoss(el);
  if(!cur&&o.mode=='order'&&!done&&CS().length){el.innerHTML=`<div class="card" style="cursor:default"><div class="vn">Chưa có câu để xếp</div><div class="mute">Cần từ có câu ví dụ gồm ít nhất 2 chữ cách nhau bởi dấu cách. Nếu đang bật “Chỉ từ cần ôn”, hãy bỏ chọn.</div></div>`;return}
  if(!cur){el.innerHTML=CS().length?`<div class="card" style="cursor:default"><div class="vn">${done?'Xong phiên học':'Không có từ nào cần ôn'}</div><div class="mute">${done?`Bạn đã qua ${done} từ.`:'Bỏ chọn “Chỉ từ cần ôn” để học tất cả.'}</div></div><div class="acts"><button class="btn pri" onclick="learnAll()">Học lại từ đầu</button></div>`
    :`<div class="card" style="cursor:default"><div class="vn">Chưa có từ vựng</div><div class="mute">Mở mục Dữ liệu để dán hoặc tải file lên.</div></div><div class="acts"><button class="btn pri" onclick="setView('data')">Nhập từ vựng</button></div>`;return}
  if(o.mode=='listen')return gListen(el);if(o.mode=='sent')return gSent(el);if(o.mode=='order')return gOrder(el);const c=cur,m=o.mode,kv=m!='type'&&o.dir=='kv';
  const extra=(c.p?`<div class="sub">${esc(c.p)}</div>`:'')+(c.e?`<div class="ex">${esc(c.e)}</div>`:'');
  const HG=t=>`<div class="hg">${esc(t)}</div>`,VN=t=>`<div class="vn">${esc(t)}</div>`;
  const hv=m=='card'?(kv||flipped):(kv||answered!==null);
  let h=`<div class="bar"><i style="width:${done/(done+Q.length)*100}%"></i></div><div class="mute">Còn ${Q.length} từ${c.g?', nhóm '+esc(c.g):''}</div>`;
  if(m=='card'){
    h+=`<div class="card ${flipped?'fl':''}" onclick="flip()" role="button" tabindex="0" aria-label="Lật thẻ">${flipped?`<div class="mute">${esc(kv?c.h:c.m)}</div>${kv?VN(c.m):HG(c.h)}${extra}`:(kv?HG(c.h):VN(c.m))}</div>`;
    h+=flipped?`<div class="acts"><button class="btn bad" onclick="rate(false)">Chưa nhớ (1)</button><button class="btn ok" onclick="rate(true)">Đã nhớ (2)</button></div>`
      :`<div class="acts"><button class="btn pri" onclick="flip()">Lật thẻ (Space)</button></div>`}
  else if(m=='quiz'){
    h+=`<div class="card s" style="cursor:default">${kv?HG(c.h):VN(c.m)}${answered!==null?extra:''}</div><div class="opts">`+
      optIds.map((id,i)=>{const x=S.cards.find(k=>k.id==id);
        const cl=answered===null?'':(id==c.id?'right':(id==answered?'wrong':''));
        return`<button class="opt ${kv?'':'k'} ${cl}" onclick="pickOpt('${id}')">${i+1}. ${esc(kv?x.m:x.h)}</button>`}).join('')+`</div>`;
    if(answered!==null)h+=`<div class="acts"><button class="btn pri" onclick="advance()">Tiếp (Enter)</button></div>`}
  else{
    h+=`<div class="card s" style="cursor:default">${VN(c.m)}${answered!==null?extra:''}</div>`;
    if(answered===null)h+=`<input id="ti" type="text" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ bằng tiếng Hàn" aria-label="Đáp án tiếng Hàn"><div class="acts"><button class="btn pri" onclick="submitType()">Kiểm tra</button></div>`;
    else h+=`<div class="msg" style="color:var(--${wrong?'bad':'ok'})">${wrong?'Chưa đúng. Đáp án: ':'Chính xác: '}<span style="font:700 28px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">${esc(c.h)}</span></div><div class="acts"><button class="btn pri" onclick="advance()">Tiếp (Enter)</button></div>`}
  if(hv)h+=`<div class="acts"><button class="btn sm" onclick="speak(cur.h)">Nghe phát âm</button></div>`;
  el.innerHTML=h;
  if(m=='type'&&answered===null)setTimeout(()=>{const i=$('#ti');i&&i.focus()},0)}

addEventListener('keydown',e=>{
  if(view!='study')return;if(S.opt.mode=='boss'&&BS&&!BS.over&&/^[1-4]$/.test(e.key)&&optIds[+e.key-1]&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){bossAns(optIds[+e.key-1]);return}if(S.opt.mode=='race'&&RC&&RC.left>0&&/^[1-4]$/.test(e.key)&&optIds[+e.key-1]&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){raceAns(optIds[+e.key-1]);return}if(!cur)return;const t=e.target,m=S.opt.mode;
  if(t.id=='si'){if(e.key=='Enter'&&!e.isComposing){e.preventDefault();sentSubmit()}return}
  if(t.id=='ti'){if(e.key=='Enter'){e.preventDefault();answered===null?submitType():advance()}return}
  if(['INPUT','TEXTAREA','SELECT'].includes(t.tagName))return;
  if(m=='card'){if(e.key==' '||e.key=='Enter'){e.preventDefault();flip()}else if(flipped&&e.key=='1')rate(false);else if(flipped&&e.key=='2')rate(true)}
  else if(m=='quiz'||m=='listen'){if(answered!==null&&(e.key=='Enter'||e.key==' ')){e.preventDefault();advance()}else if(/^[1-4]$/.test(e.key)&&optIds[+e.key-1])pickOpt(optIds[+e.key-1])}
  else if(m=='type'&&answered!==null&&(e.key=='Enter'||e.key==' ')){e.preventDefault();advance()}
  else if(m=='sent'&&SS.res&&SS.res.fix!==undefined&&(e.key=='Enter'||e.key==' ')){e.preventDefault();advance()}
  else if(m=='order'&&OS.res&&(e.key=='Enter'||e.key==' ')){e.preventDefault();advance()}
});

function rows(){
  const q=($('#q').value||'').toLowerCase();
  const L=CS().filter(c=>[c.h,c.m,c.p,c.g].join(' ').toLowerCase().includes(q));
  $('#rows').innerHTML=L.slice(0,300).map(c=>`<div class="row"><div class="rh">${esc(c.h)}</div><div class="rm">${esc(c.m)}<span>${esc([c.p,c.g,S.deck?'':deckName(c.d)].filter(Boolean).join(', '))}</span></div>
    <div><span class="pips" title="Mức nhớ ${c.box}/5">${[1,2,3,4,5].map(i=>`<i class="${c.box>=i?'on':''}"></i>`).join('')}</span> <button class="btn sm bad" onclick="del('${c.id}')">Xóa</button></div></div>`).join('')+(L.length>300?`<p class="mute">Hiển thị 300 trên ${L.length} từ. Dùng ô tìm kiếm để lọc.</p>`:'')||'<p class="mute">Không có từ nào.</p>'}
function addCard(){
  const v=k=>$('#a_'+k).value.trim();if(!v('h')||!v('m'))return;
  S.cards.push({id:uid(),d:S.deck||S.decks[0].id,h:v('h'),m:v('m'),p:v('p'),e:v('e'),g:v('g'),box:0,due:0});save();startSession();render()}
function del(id){S.cards=S.cards.filter(c=>c.id!=id);save();startSession();stats();rows()}

function rData(){
  $('#app').innerHTML=deckUI()+`<h2>Nhập từ vựng</h2>
    <p class="mute">Mỗi dòng một từ, các cột theo thứ tự: Tiếng Hàn, Nghĩa, Phát âm, Ví dụ, Nhóm. Hai cột đầu là bắt buộc. Nhận CSV, TSV (copy từ Excel hoặc Google Sheets) và JSON.</p>
    <input type="file" id="f" accept=".csv,.tsv,.txt,.json" onchange="readFile(this)" aria-label="Chọn file">
    <textarea id="ta" spellcheck="false" placeholder="사과, Quả táo, sagwa, 사과를 먹어요, Đồ ăn"></textarea>
    ${targetUI()}<div class="rad"><label><input type="radio" name="md" value="add" checked> Thêm vào danh sách hiện có</label><label><input type="radio" name="md" value="rep"> Thay thế toàn bộ từ trong bộ đã chọn</label></div>
    <div class="acts"><button class="btn pri" onclick="importNow()">Nhập dữ liệu</button><button class="btn" onclick="$('#ta').value=SAMPLE">Xem định dạng mẫu</button></div>
    <div class="msg" id="msg" role="status"></div>
    <h2>Sao lưu file</h2>
    <p class="mute" id="bkinfo">${bkInfo()}</p>
    <p class="mute">File sao lưu gồm mọi bộ từ, tiến độ, XP, vườn, vật nuôi, sổ boss và cài đặt. Nên cất vào Google Drive hoặc gửi vào email của bạn. Nếu mất dữ liệu, chọn lại file này để khôi phục.</p>
    <div class="acts"><button class="btn pri" onclick="backup()">Tải file sao lưu (.json)</button></div>
    <p class="mute" style="margin-top:14px">Khôi phục từ file sao lưu:</p>
    <input type="file" id="bf" accept=".json,application/json" onchange="readBackup(this)" aria-label="Chọn file sao lưu"><div id="bkp"></div>
    <div class="msg" id="bm" role="status"></div>
    <h2>Xuất từ vựng dạng văn bản</h2>
    <p class="mute">Xuất dữ liệu ra ô văn bản ở trên, rồi sao chép và lưu vào file của bạn. Bản JSON giữ cả tiến độ học.</p>
    <div class="acts"><button class="btn" onclick="exportCsv()">Xuất CSV</button><button class="btn" onclick="exportJson()">Xuất JSON</button><button class="btn" onclick="copyTa()">Sao chép ô văn bản</button></div>
    <div class="acts"><button class="btn bad" onclick="danger(this,resetProg)">Đặt lại tiến độ (bộ đang chọn)</button><button class="btn bad" onclick="danger(this,clearAll)">Xóa từ trong bộ đang chọn</button></div>`}
const msg=(t,bad)=>{const m=$('#msg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)'};
function readFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#ta').value=r.result;msg('Đã đọc file '+f.name+'. Bấm “Nhập dữ liệu” để thêm vào.')};r.readAsText(f,'utf-8')}
function importNow(){
  const cs=toCards(parseTable($('#ta').value));
  if(!cs.length)return msg('Không đọc được dòng nào. Kiểm tra mỗi dòng có ít nhất cột Hàn và cột Nghĩa.',1);
  let tg=$('#tg').value,add=0,upd=0;
  if(tg=='__new'){const n=$('#nd').value.trim();if(!n)return msg('Hãy nhập tên cho bộ mới.',1);tg=ensureDeck(n)}
  const fallback=S.deck||S.decks[0].id;
  for(const c of cs){c.d=tg=='__auto'?(c.dn?ensureDeck(c.dn):fallback):tg;delete c.dn}
  if(document.querySelector('input[name=md]:checked').value=='rep'){
    const ds=new Set(cs.map(c=>c.d));S.cards=S.cards.filter(c=>!ds.has(c.d)).concat(cs);add=cs.length}
  else for(const c of cs){const x=S.cards.find(k=>k.h==c.h&&k.d==c.d);
    if(x){Object.assign(x,{m:c.m,p:c.p||x.p,e:c.e||x.e,g:c.g||x.g});upd++}else{S.cards.push(c);add++}}
  if(S.deck&&tg!='__auto'&&tg!=S.deck)S.deck=tg;
  save();startSession();render();setView('data');msg(`Đã nhập xong: thêm ${add} từ, cập nhật ${upd} từ.`)}
const q=s=>/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
function exportCsv(){$('#ta').value=CS().map(c=>[c.h,c.m,c.p,c.e,c.g].map(q).join(',')).join('\n');msg('Đã xuất '+CS().length+' từ (CSV, bộ đang chọn).')}
function exportJson(){$('#ta').value=JSON.stringify(S.cards.map(({id,d,dn,...r})=>({...r,bo:deckName(d)})),null,1);msg('Đã xuất '+S.cards.length+' từ của mọi bộ (JSON, có tiến độ). Khi nhập lại, chọn “Theo cột bo”.')}
function copyTa(){const t=$('#ta');t.select();try{navigator.clipboard.writeText(t.value).then(()=>msg('Đã sao chép.'),()=>{document.execCommand('copy');msg('Đã sao chép.')})}catch(e){try{document.execCommand('copy');msg('Đã sao chép.')}catch(_){msg('Không sao chép được, hãy bôi đen và copy thủ công.',1)}}}
function danger(b,fn){if(b.dataset.a){fn();return}b.dataset.a=1;const t=b.textContent;b.textContent='Bấm lần nữa để xác nhận';setTimeout(()=>{delete b.dataset.a;b.textContent=t},4000)}
function resetProg(){CS().forEach(c=>{c.box=0;c.due=0});save();startSession();stats();msg('Đã đặt lại tiến độ.')}
function clearAll(){S.cards=S.deck?S.cards.filter(c=>c.d!=S.deck):[];save();startSession();stats();msg('Đã xóa tất cả từ.')}

function rRem(){const r=S.rem;
  $('#app').innerHTML=`<h2>Nhắc học mỗi ngày</h2>

    <label class="chk"><input type="checkbox" ${r.on?'checked':''} onchange="remToggle(this)"> Bật thông báo lúc đến giờ</label>
    <div class="msg" id="rmsg" role="status"></div>`;remLink()}
function remSet(v){S.rem.time=v||'20:00';S.rem.last='';save();remLink()}
function remLink(){const [h,m]=S.rem.time.split(':').map(Number),d=new Date(),p=n=>String(n).padStart(2,'0');
  const s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);if(s<d)s.setDate(s.getDate()+1);const e=new Date(s.getTime()+9e5);
  const f=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`;
  $('#gc').href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Học từ vựng tiếng Hàn')+'&details='+encodeURIComponent('Ôn các từ đến hạn: https://claude.ai/artifact/8ahg7mEZoHXvxpFWnJZXLz')+'&dates='+f(s)+'/'+f(e)+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY')}
async function remToggle(cb){const m=$('#rmsg');let ok=cb.checked;
  if(ok){try{ok=('Notification' in window)&&(Notification.permission=='granted'||await Notification.requestPermission()=='granted')}catch(e){ok=false}
    if(!ok){cb.checked=false;m.textContent='Chưa bật được thông báo (trình duyệt chặn hoặc không hỗ trợ). Hãy dùng Google Calendar ở mục 1.';m.style.color='var(--bad)'}
    else{m.textContent='Đã bật. Giữ tab này mở để nhận thông báo lúc '+S.rem.time+'.';m.style.color='var(--ok)'}}
  S.rem.on=ok;save()}
function tick(){const now=new Date(),r=S.rem,key=now.toDateString(),due=S.cards.filter(c=>c.due<=now.getTime()).length;
  document.title=(due?`(${due}) `:'')+'Học từ vựng tiếng Hàn';
  if(!r.on||r.last==key||typeof Notification=='undefined'||Notification.permission!='granted')return;
  const [h,m]=r.time.split(':').map(Number);
  if(now.getHours()*60+now.getMinutes()>=h*60+m){r.last=key;save();if(due)try{new Notification('Đến giờ học tiếng Hàn',{body:`Có ${due} từ cần ôn hôm nay.`})}catch(e){}}}
let MG=null,RC=null;
function gain(n){const l0=1+Math.floor((S.xp||0)/100);S.xp=(S.xp||0)+n;if(1+Math.floor(S.xp/100)>l0){sfx('win');pop('Lên cấp '+(1+Math.floor(S.xp/100))+'!',1)}else if(n>0)pop('+'+n+' XP');const k=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString(),s=S.sk||(S.sk={d:'',n:0});if(s.d!=k){s.n=(s.d==y||(has(16)&&s.d==new Date(Date.now()-1728e5).toDateString()))?s.n+1:1;s.d=k}}
function streak(){const s=S.sk;if(!s)return 0;const t=Date.now();return[new Date(t).toDateString(),new Date(t-864e5).toDateString(),...(has(16)?[new Date(t-1728e5).toDateString()]:[])].includes(s.d)?s.n:0}
function pickIdx(i){pickOpt(optIds[i])}
function gListen(el){const c=cur;

  L.forEach(n=>{const f=document.createDocumentFragment();let p=0,m;RE.lastIndex=0;while((m=RE.exec(n.data))){f.append(n.data.slice(p,m.index),img(M[m[0]],'ic',m[0]));p=m.index+m[0].length}f.append(n.data.slice(p));n.replaceWith(f)})}
// vườn: cây theo 5 giai đoạn
const CROP=['carrot','tomato','corn','strawberry','eggplant','potato'],ST={'🟫':0,'🌱':1,'🌿':2,'🌼':3};
function garden(){const fm=document.querySelector('#farm .fm');if(!fm||fm.querySelector('.scene'))return;
  const pl=[...fm.querySelectorAll('.pl')];
  pl.forEach((e,i)=>{const t=e.textContent.trim();let src,s;if(t=='🥀')src='crops/wilt';else if(t=='🐛')src='crops/pest';else{s=t in ST?ST[t]:4;src=`crops/${CROP[i%6]}_${s}`}
    e.dataset.s=s??'x';e.textContent='';e.append(img(src,'plant',t))});
  const sc=document.createElement('div');sc.className='scene';fm.prepend(sc);
  if(pl.length){const bed=document.createElement('div');bed.className='bed';pl[0].before(bed);pl.forEach(e=>bed.append(e));const pa=document.createElement('div');pa.className='path';bed.after(pa)}}
// mascot
const mas=document.createElement('div');mas.id='mas';mas.innerHTML='<div class="say"></div>';const mi=img('mascot/idle','');mas.append(mi);
let mt,sl,say=mas.querySelector('.say'),TXT={ok:['Giỏi lắm!','Chính xác!','Tuyệt!'],bad:['Không sao, thử lại nhé','Cố lên!'],win:['Lên cấp rồi!'],hello:['Chào bạn!'],sleep:['Zzz…']};
function mascot(s,ms=1600){clearTimeout(mt);mi.src=A+'mascot/'+s+'.svg';const t=TXT[{happy:'ok',sad:'bad',jump:'win',hello:'hello',sleep:'sleep'}[s]];if(t){say.textContent=t[Math.random()*t.length|0];say.classList.add('on')}
  if(s!='sleep')mt=setTimeout(()=>{mi.src=A+'mascot/idle.svg';say.classList.remove('on')},ms)}
const wake=()=>{clearTimeout(sl);if(mi.src.includes('sleep'))mascot('hello',1800);sl=setTimeout(()=>mascot('sleep'),60000)};
['pointerdown','keydown'].forEach(e=>addEventListener(e,wake,{passive:true}));mas.onclick=()=>mascot('hello');
// bọc hàm V2 (giữ nguyên hành vi gốc)
const wrap=(n,f)=>{try{const o=window[n];if(typeof o=='function')window[n]=function(...a){const r=o.apply(this,a);try{f(a,r)}catch(e){}return r}}catch(e){}};
wrap('sfx',([k])=>{if(k=='ok')mascot('happy');else if(k=='bad'||k=='lose')mascot('sad');else if(k=='win')mascot('jump',2400)});
const _pop=window.pop;window.pop=function(t,big){if(!big)return _pop(t,big);if(/^Lên cấp/.test(t))return levelUp(t);return reward(t)};
function levelUp(t){const d=document.createElement('div');d.className='lvl';d.innerHTML=`<img class="rays" src="${A}fx/rays.svg" alt=""><div class="bx"><img class="m" src="${A}mascot/jump.svg" alt=""><b>${t}</b><div class="mute">Giỏi lắm! Nông trại của bạn lớn thêm rồi.</div><button class="btn pri" style="margin-top:12px">Tiếp tục</button></div>`;
  const c=()=>d.remove();d.querySelector('button').onclick=c;d.onclick=e=>{if(e.target==d)c()};document.body.append(d);d.querySelector('button').focus();setTimeout(c,5000)}
function reward(t){const d=document.createElement('div');d.className='rw';d.innerHTML=`<div class="bx"><img src="${A}icons/chest.svg" alt="" onerror="this.remove()">${t.replace(/[<&]/g,'')}</div>`;document.body.append(d);setTimeout(()=>d.remove(),1900)}
// thu hoạch: cây bay lên + thưởng bay về XP
wrap('harvest',()=>{});const _h=window.harvest;window.harvest=function(){try{const t=document.querySelector('#st').getBoundingClientRect();document.querySelectorAll('#farm .pl[data-s="4"]').forEach((p,i)=>{if(i>11)return;const r=p.getBoundingClientRect(),im=p.querySelector('img');
  const f=document.createElement('div');f.className='fly';f.style.transform=`translate(${r.left}px,${r.top}px)`;f.append(im?im.cloneNode():img('icons/star'));document.body.append(f);
  const a=f.animate([{transform:`translate(${r.left}px,${r.top}px) scale(1)`},{transform:`translate(${r.left}px,${r.top-70}px) scale(1.4) rotate(-8deg)`,offset:.35},{transform:`translate(${t.left+30}px,${t.top}px) scale(.3)`,opacity:.2}],{duration:1000,delay:i*60,easing:'cubic-bezier(.3,.7,.3,1)',fill:'backwards'});a.onfinish=()=>f.remove();
  const c=img('icons/coin','');c.className='fly';c.style.cssText=`transform:translate(${r.left}px,${r.top}px);width:30px;height:30px`;document.body.append(c);const b=c.animate([{transform:`translate(${r.left+10}px,${r.top}px)`},{transform:`translate(${t.left+60}px,${t.top+10}px) scale(.5)`,opacity:.3}],{duration:900,delay:200+i*60,easing:'ease-in',fill:'backwards'});b.onfinish=()=>c.remove()})}catch(e){}return _h.apply(this,arguments)};
// boss
const BC=['#E8503A','#2BB5A3','#8E7CD8','#3D5A80','#F29E4C'];
function boss(){if(typeof BS=='undefined'||!BS||S.opt.mode!='boss')return;const st=document.getElementById('stage');if(!st)return;const sp=st.querySelector('span[style*="46px"]');
  st.style.setProperty('--bc',BC[Math.max(0,BOSS.indexOf(BS.e))]);
  if(sp&&!sp.classList.contains('bossimg')){sp.classList.add('bossimg');if(BS.pick!=null)sp.classList.add(BS.pick==BS.c.id?'dmg':'atk');
    const bar=st.querySelector('.bar:not(.hp)');if(bar){bar.classList.add('hp');bar.insertAdjacentHTML('beforeend',`<b>${BS.hp}/${BS.max}</b>`)}}
  const hr=[...st.querySelectorAll('.mute')].find(e=>/^(❤️|🖤|<img)/.test(e.textContent.trim()||'')||e.querySelector('.ic[src*="heart"]'));if(hr)hr.classList.add('hearts');
  if(BS.over=='win'){const v=st.querySelector('.card.s');if(v&&!v.querySelector('.ko')){v.classList.add('win');v.insertAdjacentElement('afterbegin',img('bosses/'+['dokkaebi','yong','gwisin','gangsi','gongnyong'][Math.max(0,BOSS.indexOf(BS.e))],'ko'))}}
  if(BS.over&&BS.over!='win'){const v=st.querySelector('.card.s');if(v)v.classList.add('lost')}}
// journey map (trang Sổ sưu tầm)
function jmap(){const a=document.getElementById('app');if(!a||a.querySelector('.jmap')||!a.querySelector('.dq')||document.querySelector('.tab.on .ti img[src*=trophy]')==null)return;
  const L=1+Math.floor((S.xp||0)/100),b=Math.max(1,L-2),N=7;let d='',n='',p=[];for(let i=0;i<N;i++)p.push([30+i*50,80+(i%2?-26:26)]);
  d='M'+p[0].join(' ')+p.slice(1).map((q,i)=>` Q ${p[i][0]+25} ${(p[i][1]+q[1])/2+(i%2?14:-14)} ${q[0]} ${q[1]}`).join('');n=p.map(([x,y],i)=>{const lv=b+i,cur=lv==L,dn=lv<L,ms=lv%5==0;return `<g>${ms?`<image href="${A}icons/chest.svg" x="${x-15}" y="${y-18}" width="30" height="30"/>`:`<circle cx="${x}" cy="${y}" r="11" fill="${dn?'#2E9B52':cur?'#FFC83D':'#fff'}" stroke="#5A3A22" stroke-width="3"/>`}<text x="${x}" y="${y+(ms?24:4)}" text-anchor="middle" font-size="10" font-weight="700" fill="${ms?'#5A3A22':dn?'#fff':'#5A3A22'}">${ms?lv:lv}</text>${cur?`<image href="${A}mascot/idle.svg" x="${x-22}" y="${y-58}" width="44" height="44"/>`:''}</g>`}).join('');
  a.querySelector('.dq').insertAdjacentHTML('beforebegin',`<h2>Bản đồ hành trình</h2><div class="jmap"><svg viewBox="0 0 360 150" role="img" aria-label="Bạn đang ở cấp ${L}"><path d="${d}" fill="none" stroke="#C99A62" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 14"/>${n}</svg></div>`)}
let q=0;const run=()=>{q=0;garden();boss();jmap();skin(document.body)};
new MutationObserver(()=>{if(!q)q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true});
const pr=new Image();pr.onerror=()=>{off=true;document.documentElement.classList.add('noart')};pr.src=A+'mascot/idle.svg';
document.body.append(mas);run();mascot('hello',2500);wake();
})();
</script>
<script id="v4js">
/* ===== V4 motion layer: chỉ thêm hoạt ảnh, không đổi logic V3 ===== */
(()=>{
const A='assets/',R=matchMedia('(prefers-reduced-motion:reduce)').matches,LITE=(navigator.hardwareConcurrency||4)<=4||innerWidth<641;
const de=document.documentElement;if(LITE)de.classList.add('v4lite');
const $$=(s,r=document)=>[...r.querySelectorAll(s)],rnd=(a,b)=>a+Math.random()*(b-a);
const mk=(src,cls)=>{const d=document.createElement('div');d.className=cls;const i=new Image();i.src=A+src;i.alt='';i.draggable=false;i.onerror=()=>d.remove();d.append(i);return d};
// tạm dừng mọi animation khi ẩn tab
document.addEventListener('visibilitychange',()=>de.classList.toggle('v4pause',document.hidden));
// particle (WAAPI, ít & nhẹ trên điện thoại)
function burst(x,y,n=10,src='fx/spark.svg'){if(R)return;n=LITE?Math.ceil(n/2):n;for(let i=0;i<n;i++){const p=mk(src,'v4p'),a=rnd(0,6.28),d=rnd(30,80);p.style.transform=`translate(${x}px,${y}px)`;document.body.append(p);
 p.animate([{transform:`translate(${x}px,${y}px) scale(.4)`,opacity:1},{transform:`translate(${x+Math.cos(a)*d}px,${y+Math.sin(a)*d-20}px) scale(1.1) rotate(${rnd(-90,90)}deg)`,opacity:0}],{duration:rnd(500,850),easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}}
window.v4burst=burst;
// cảnh nông trại có chiều sâu
function scene(){$$('#farm .scene:not(.v4d)').forEach(sc=>{sc.classList.add('v4d');
 const sun=mk('scene/sun.svg','v4l v4sun');sc.append(sun);
 [[8,'34%',46],[22,'30%',-18],[14,'46%',-60]].forEach(([t,w,dl],i)=>{const c=mk('scene/cloud.svg','v4l v4cl');c.style.cssText=`--t:${t}%;--w:${w};--d:${70+i*25}s;--dl:${dl}s`;c.dataset.p=.1+i*.08;sc.append(c)});
 [[14,26,0],[24,38,-11]].forEach(([t,d,dl])=>{const b=mk('scene/bird.svg','v4l v4bd');b.style.cssText=`--t:${t}%;--d:${d}s;--dl:${dl}s`;sc.append(b)});
 sc.append(mk('decor/butterflies.svg','v4l v4bf'),Object.assign(document.createElement('div'),{className:'v4l v4gr'}));
 sc.dataset.p=1})}
// parallax khi cuộn (1 rAF, chỉ khi cảnh trong màn hình)
let pq=0;addEventListener('scroll',()=>{if(R||pq)return;pq=requestAnimationFrame(()=>{pq=0;$$('.v4d').forEach(sc=>{const r=sc.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const o=r.top*.12;sc.style.backgroundPosition=`center calc(100% + ${-o*.4}px)`;sc.querySelectorAll('.v4sun').forEach(e=>e.style.translate=`0 ${o*.3}px`)})})},{passive:true});
// mascot: trạng thái + bong bóng thoại + hành vi tự phát
const mas=document.getElementById('mas');
if(mas){const z=new Image();z.src=A+'fx/zzz.svg';z.className='z';z.onerror=()=>z.remove();mas.append(z);
 const say=mas.querySelector('.say'),T={walk:['Đi dạo nào!'],run:['Chạy thôi!'],work:['Đang tưới cây…','Cuốc đất nào!'],celebrate:['Nhảy múa thôi!'],surprise:['Ồ! Quà kìa!'],encourage:['Sai không sao, cố lên nha!','Thử lại nhé, bạn làm được!'],hello:['Chào bạn!','Hôm nay học gì nào?'],happy:['Tuyệt vời!']};
 let st,t2;const S0=(s,ms=1800,txt)=>{mas.dataset.s=s;clearTimeout(t2);const t=txt||(T[s]&&T[s][Math.random()*T[s].length|0]);if(t&&say){say.textContent=t;say.classList.add('on')}
  if(s!='sleep')t2=setTimeout(()=>{delete mas.dataset.s;say&&say.classList.remove('on')},ms)};
 window.mascotState=S0;
 // đồng bộ với trạng thái V3 (ảnh idle/happy/sad/jump/hello/sleep)
 new MutationObserver(()=>{const m=(mas.querySelector('img:not(.z)').src.match(/mascot\/(\w+)\.svg/)||[])[1];if(m&&m!='idle')mas.dataset.s=m;else if(mas.dataset.s&&!['walk','run','work','celebrate','surprise','encourage'].includes(mas.dataset.s))delete mas.dataset.s}).observe(mas,{attributes:true,subtree:true,attributeFilter:['src']});
 const orig=mas.onclick;mas.onclick=()=>{orig&&orig();const k=['hello','happy','surprise','celebrate'][Math.random()*4|0];S0(k,1600);const r=mas.getBoundingClientRect();burst(r.left+r.width/2,r.top+10,6)};
 // hoạt động ngẫu nhiên khi ở nông trại
 const idle=()=>{clearTimeout(st);st=setTimeout(()=>{if(!document.hidden&&!mas.dataset.s&&document.querySelector('#farm .scene')&&!R)S0(['walk','work','run','hello'][Math.random()*4|0],2200);idle()},rnd(9000,16000))};idle();
 window.addEventListener('v4:wrong',()=>S0('encourage',2200));window.addEventListener('v4:reward',()=>S0('surprise',1800));window.addEventListener('v4:lvl',()=>S0('celebrate',2600))}
// vật nuôi: idle ngẫu nhiên riêng từng loài + phản ứng khi chạm
const MOVE={'hen':[['hop',[0,-10,0]],['peck',[0,8,0]]],'dog':[['wag',[-6,6,-6,6,0]],['hop',[0,-14,0]]],'pig':[['roll',[0,-8,8,0]],['walk',[0,12,0]]],'cow':[['chew',[1,.98,1,.98,1]],['tail',[-2,2,-2,0]]],'sheep':[['hop',[0,-12,0,-8,0]],['graze',[0,6,0]]],'horse':[['stomp',[0,-6,0,-6,0]],['shake',[-4,4,-4,4,0]]]},SND={hen:'Cục tác!',dog:'Gâu gâu!',pig:'Ụt ịt!',cow:'Ò ó o!',sheep:'Be he!',horse:'Hí hí!'};
function petAnim(el,big){const im=el.querySelector('img');if(!im||R)return;const k=(im.src.match(/pets\/(\w+)\.svg/)||[])[1],m=MOVE[k];if(!m)return;const [n,v]=m[Math.random()*m.length|0],dir=/hop|stomp|peck|graze/.test(n);
 el.animate(v.map(x=>dir?{transform:`translateY(${x}px)`}:/chew|tail|wag|shake/.test(n)&&n!='chew'?{transform:`rotate(${x}deg)`}:n=='chew'?{transform:`scaleY(${x})`}:{transform:`translateX(${x}px)`}),{duration:big?700:rnd(800,1400),easing:'ease-in-out'});
 if(big){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top,5);const s=document.createElement('div');s.textContent=SND[k]||'';s.style.cssText='position:fixed;z-index:96;font:700 13px "Be Vietnam Pro";background:#fff;border-radius:10px;padding:2px 8px;pointer-events:none;left:'+r.left+'px;top:'+(r.top-20)+'px';document.body.append(s);s.animate([{opacity:1},{opacity:0,transform:'translateY(-18px)'}],{duration:1100}).onfinish=()=>s.remove()}}
function pets(){$$('#farm .yard .pet:not(.v4bi)').forEach(p=>{p.classList.add('v4bi');p.addEventListener('click',()=>petAnim(p,true))})}
setInterval(()=>{if(document.hidden)return;const p=$$('#farm .yard .pet');if(p.length)petAnim(p[Math.random()*p.length|0])},2600);
// sự kiện: đúng/sai/XP bay về thanh trạng thái/thưởng
const w=(n,f)=>{const o=window[n];if(typeof o=='function')window[n]=function(...a){const r=o.apply(this,a);try{f(a,r)}catch(e){}return r}};
w('sfx',([k])=>{const s=document.getElementById('stage');if(k=='ok'&&s){const r=s.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,8)}
 if(k=='bad'||k=='lose')dispatchEvent(new Event('v4:wrong'))});
w('pop',([t,big])=>{if(!big&&/XP/.test(t)){const st=document.getElementById('st');if(!st||R)return;const b=st.getBoundingClientRect(),x=innerWidth/2,y=innerHeight*.55,p=mk('icons/star.svg','v4p');document.body.append(p);
  p.animate([{transform:`translate(${x}px,${y}px) scale(1)`},{transform:`translate(${b.left+40}px,${b.top+10}px) scale(.4)`,opacity:.3}],{duration:800,easing:'cubic-bezier(.5,0,.8,.4)'}).onfinish=()=>{p.remove();burst(b.left+40,b.top+10,4)}}
 if(big&&!/^Lên cấp/.test(t)){dispatchEvent(new Event('v4:reward'));burst(innerWidth/2,innerHeight/2,16)}
 if(big&&/^Lên cấp/.test(t)){dispatchEvent(new Event('v4:lvl'));[0,250,500].forEach(d=>setTimeout(()=>burst(rnd(80,innerWidth-80),rnd(120,innerHeight/2),14),d))}});
w('harvest',()=>{$$('#farm .pl[data-s="4"]').slice(0,8).forEach(p=>{const r=p.getBoundingClientRect();burst(r.left+29,r.top+10,5)})});
// chuyển trang mềm
const app=document.getElementById('app');let lv=null;w('render',()=>{if(app&&typeof view!='undefined'&&view!==lv){lv=view;if(!R){app.classList.remove('v4in');void app.offsetWidth;app.classList.add('v4in')}}});
// gắn thêm khi DOM đổi (dùng chung 1 observer, throttle bằng rAF)
let q=0;new MutationObserver(()=>{if(!q)q=requestAnimationFrame(()=>{q=0;scene();pets()})}).observe(document.body,{childList:true,subtree:true});scene();pets();
})();
